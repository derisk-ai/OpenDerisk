identity:
  name: "Flat Motion Graphics"
  category: motion-graphics
  mood: energetic, modern, bold
  pace: fast
  best_for: "社媒解说、短视频榜单、产品发布、创业路演"
  source: "migrated from OpenMontage styles/flat-motion-graphics.yaml"

visual_language:
  color_palette:
    primary: ["#7C3AED", "#4F46E5"]
    accent: ["#EC4899", "#06B6D4"]
    background: "#0F172A"
    text: "#F8FAFC"
    muted: "#64748B"
  # webanim 模板注入值（pv_template.py --style flat-motion-graphics 自动带入）
  template_injection:
    TEXT_COLOR: "#FFFFFF"
    BG1: "#0F172A"
    BG2: "#1E1B4B"
    ACCENT: "#EC4899"
    ACCENT2: "#06B6D4"
    BAR_COLORS: ["#7C3AED", "#EC4899", "#06B6D4", "#F59E0B", "#10B981", "#EF4444"]
  typography:
    headings: { font: "Space Grotesk", weight: 700 }
    body: { font: "Space Grotesk", weight: 400, line_height: 1.5 }
  motion:
    transitions: [wipe-left, zoom-in, morph, cut]
    animation_style: "spring(1, 80, 10), bouncy, overshooting"
    pacing_rules:
      min_scene_hold_seconds: 1.5
      max_scene_hold_seconds: 8
      text_card_hold_seconds: 2.5
      transition_duration_seconds: 0.3
    entrance: "scale-up with bounce (0.8 -> 1.05 -> 1.0)"
    exit: "scale-down-fade"
  audio:
    voice_style: "energetic, conversational, slightly fast pace"
    music_mood: "lo-fi beat, electronic, driving rhythm"
    music_volume: 0.12

asset_generation:
  # fullvideo/imageflow 模式下生图时使用的前缀与负面词
  image_prompt_prefix: "flat vector illustration, bold colors, dark background, geometric shapes, "
  image_negative_prompt: "photorealistic, watercolor, vintage, muted colors, white background"
  consistency_anchors:
    - "紫色 #7C3AED 作为全局主色"
    - "深石板 #0F172A 背景贯穿所有场景"
    - "大胆几何插画风"
    - "霓虹亮色点缀强调"

quality_rules:
  - "文本对比度不低于 4.5:1"
  - "同屏最多 4 色（深色背景计一色）"
  - "720p 移动端可读（字号取大）"
  - "每镜至少一个动画元素"
  - "每 2-3 秒出现新视觉元素"
