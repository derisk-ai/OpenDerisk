<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-libs" content="gsap">
<style>
  /* 设计令牌（8pt 栅格 / 字阶固定比例，防错位）*/
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:{{WIDTH}}px; height:{{HEIGHT}}px; overflow:hidden; }
  body {
    background: linear-gradient(160deg, {{BG1}} 0%, {{BG2}} 100%);
    font-family: "WenQuanYi Micro Hei", "Noto Sans CJK SC", "PingFang SC", sans-serif;
    color: {{TEXT_COLOR}};
    display: flex; flex-direction: column;
    padding: {{PAD}}px {{PAGE_PAD}}px; /* 垂直 PAD / 水平 PAGE_PAD，防卡片裁切 */
    gap: {{GAP}}px;
  }
  #kicker { font-size: {{KICKER_SIZE}}px; letter-spacing: 6px; color: {{ACCENT2}};
    opacity: 0; text-transform: uppercase; font-weight: bold; }
  #title { font-size: {{TITLE_SIZE}}px; font-weight: bold; line-height: 1.3;
    opacity: 0; margin: 0; }
  #title .accent { color: {{ACCENT}}; }
  #steps { display: flex; flex-direction: column; gap: {{SGAP}}px; flex: 1;
    justify-content: center; }
  .step { display: flex; align-items: center; gap: {{SGAP}}px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13);
    border-radius: 20px; padding: {{CPAD}}px {{CPADX}}px; opacity: 0; }
  .step .num { flex: none; width: {{NUM}}px; height: {{NUM}}px; border-radius: 50%;
    background: linear-gradient(135deg, {{ACCENT}}, {{ACCENT2}});
    display: flex; align-items: center; justify-content: center;
    font-size: {{NUM_SIZE}}px; font-weight: bold; }
  .step .txt { font-size: {{STEP_SIZE}}px; line-height: 1.5; flex: 1; }
  #caption { font-size: {{CAP_SIZE}}px; color: {{ACCENT2}}; opacity: 0;
    text-align: center; }
  #bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12);
    overflow: hidden; }
  #barfill { height: 100%; width: 0%;
    background: linear-gradient(90deg, {{ACCENT}}, {{ACCENT2}}); }
</style>
</head>
<body>
  <div id="kicker">{{KICKER}}</div>
  <h1 id="title">{{TITLE}}</h1>
  <div id="steps"></div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="caption">{{CAPTION}}</div>
<script>
  window.__duration = {{DURATION}};
  (function () {
    var D = window.__duration;
    var steps = {{STEPS_JSON}};
    var box = document.getElementById("steps");
    steps.forEach(function (s, i) {
      var el = document.createElement("div");
      el.className = "step";
      var num = document.createElement("div");
      num.className = "num"; num.textContent = String(i + 1);
      var txt = document.createElement("div");
      txt.className = "txt"; txt.textContent = s;
      el.appendChild(num); el.appendChild(txt);
      box.appendChild(el);
    });
    /* GSAP 时间轴：paused + __seek 用 time(t) 精确定位（确定性）*/
    var tl = gsap.timeline({ paused: true });
    var cards = document.querySelectorAll(".step");
    /* 节奏预算：开场 18% → 要点交错 55% → 进度条+收尾 27% */
    var t0 = D * 0.10, tSteps = D * 0.55, tEnd = D * 0.25;
    var per = tSteps / Math.max(steps.length, 1);
    tl.fromTo("#kicker", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0)
      .fromTo("#title", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.15);
    cards.forEach(function (el, i) {
      tl.fromTo(el, {
        x: -60, opacity: 0, scale: 0.94
      }, {
        x: 0, opacity: 1, scale: 1,
        duration: Math.min(0.65, per), ease: "back.out(1.4)"
      }, t0 + i * per * 0.85);
    });
    var barStart = t0 + steps.length * per * 0.85;
    tl.to("#barfill", { width: "100%", duration: Math.max(0.6, tEnd * 0.6),
        ease: "power2.inOut" }, barStart)
      .fromTo("#caption", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        barStart + 0.2);
    window.__ready = function () { return Promise.resolve(); };
    window.__seek = function (t) {
      tl.time(Math.max(0, Math.min(t, tl.duration())));
    };
    window.__seek(0);
  })();
</script>
</body>
</html>
