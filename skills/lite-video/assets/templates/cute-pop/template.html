<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:{{WIDTH}}px; height:{{HEIGHT}}px; overflow:hidden; }
  body {
    background: linear-gradient(160deg, {{BG1}} 0%, {{BG2}} 100%);
    font-family: "WenQuanYi Micro Hei", "Noto Sans CJK SC", "PingFang SC", sans-serif;
    color: {{TEXT_COLOR}};
  }
  /* 漂浮装饰：纯时间函数驱动 */
  .floaty { position:absolute; border-radius:50%; opacity:0.5; }
  .star { position:absolute; color:{{ACCENT2}}; font-size:{{FLOAT_SIZE}}px; opacity:0; }
  #title { position:absolute; top:6%; width:100%; text-align:center;
    font-size:{{TITLE_SIZE}}px; font-weight:bold; color:{{ACCENT}}; opacity:0; }
  #card { position:absolute; top:22%; left:8%; width:84%;
    background:rgba(255,255,255,0.94); color:#3a3350; border-radius:36px;
    padding:{{CARD_PAD}}px; box-shadow:0 18px 50px rgba(0,0,0,0.3); opacity:0; }
  #emoji { font-size:{{EMOJI_SIZE}}px; text-align:center; margin-bottom:10px; }
  #text { font-size:{{TEXT_SIZE}}px; line-height:1.7; text-align:center; font-weight:bold; }
  #sub { position:absolute; top:calc(22% + {{CARD_H}}px + 30px); width:100%;
    text-align:center; font-size:{{SUB_SIZE}}px; color:{{ACCENT2}}; opacity:0; }
  /* 脸颊腮红 + 眨眼装饰 */
  .blush { position:absolute; width:40px; height:26px; border-radius:50%;
    background:#ffb6c1; opacity:0; filter:blur(6px); }
</style>
</head>
<body>
  <div class="floaty" id="f1" style="background:{{ACCENT}}"></div>
  <div class="floaty" id="f2" style="background:{{ACCENT2}}"></div>
  <div class="floaty" id="f3" style="background:#ffd166"></div>
  <div class="star" id="s1">✦</div>
  <div class="star" id="s2">✦</div>
  <div class="star" id="s3">❀</div>
  <div id="title">{{TITLE}}</div>
  <div id="card">
    <div id="emoji">{{EMOJI}}</div>
    <div id="text"></div>
  </div>
  <div class="blush" id="bl1"></div>
  <div class="blush" id="bl2"></div>
  <div id="sub">{{SUBTITLE}}</div>
<script>
  window.__duration = {{DURATION}};
  (function () {
    var D = window.__duration;
    var W = {{W}}, H = {{HEIGHT}};
    var text = {{TEXT_JSON}};
    var hls = ({{HIGHLIGHT_JSON}} || []).filter(Boolean);
    // 文本拆分（关键词高亮）
    var textEl = document.getElementById("text");
    (function build() {
      var rest = text, chars = [];
      while (rest.length) {
        var idx = -1, hit = "";
        hls.forEach(function (h) {
          var i = rest.indexOf(h);
          if (i >= 0 && (idx < 0 || i < idx)) { idx = i; hit = h; }
        });
        if (idx < 0) { chars.push({ t: rest, hl: false }); break; }
        if (idx > 0) chars.push({ t: rest.slice(0, idx), hl: false });
        chars.push({ t: hit, hl: true });
        rest = rest.slice(idx + hit.length);
      }
      chars.forEach(function (c) {
        var s = document.createElement("span");
        s.textContent = c.t;
        if (c.hl) { s.style.color = "{{ACCENT}}"; }
        s.style.display = "inline-block";
        s.style.opacity = 0;
        s.style.transform = "translateY(20px)";
        textEl.appendChild(s);
      });
    })();
    var spans = Array.prototype.slice.call(textEl.children);
    // 果冻弹跳缓动（overshoot）：纯函数
    function bounce(x) {
      x = Math.max(0, Math.min(1, x));
      var c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }
    function ease(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
    window.__seek = function (t) {
      // 卡片果冻入场（0~0.8s）
      var card = document.getElementById("card");
      var b = bounce(t / 0.8);
      card.style.opacity = Math.min(1, t / 0.3);
      card.style.transform = "scale(" + (0.6 + 0.4 * b) + ") rotate(" + ((1 - ease(t / 0.8)) * -4) + "deg)";
      document.getElementById("title").style.opacity = ease((t - 0.3) / 0.6);
      document.getElementById("sub").style.opacity = ease((t - D * 0.6) / 0.8);
      // emoji 呼吸 + 眨眼装饰
      var em = document.getElementById("emoji");
      em.style.transform = "scale(" + (1 + 0.08 * Math.sin(t * 3.0)) + ")";
      // 腮红跟随卡片
      var bl = Math.min(1, t / 0.8);
      document.getElementById("bl1").style.opacity = bl * 0.8;
      document.getElementById("bl2").style.opacity = bl * 0.8;
      // 漂浮装饰：纯时间函数
      var f1 = document.getElementById("f1"), f2 = document.getElementById("f2"), f3 = document.getElementById("f3");
      var r1 = W * 0.09, r2 = W * 0.06, r3 = W * 0.05;
      f1.style.width = f1.style.height = r1 + "px";
      f2.style.width = f2.style.height = r2 + "px";
      f3.style.width = f3.style.height = r3 + "px";
      f1.style.left = (W * 0.08 + Math.sin(t * 0.7) * W * 0.05) + "px";
      f1.style.top = (H * 0.7 + Math.cos(t * 0.5) * H * 0.04) + "px";
      f2.style.left = (W * 0.8 + Math.cos(t * 0.6) * W * 0.05) + "px";
      f2.style.top = (H * 0.16 + Math.sin(t * 0.55) * H * 0.03) + "px";
      f3.style.left = (W * 0.72 + Math.sin(t * 0.8) * W * 0.04) + "px";
      f3.style.top = (H * 0.75 + Math.cos(t * 0.65) * H * 0.035) + "px";
      // 星星闪烁：透明度脉冲
      ["s1", "s2", "s3"].forEach(function (id, i) {
        var el = document.getElementById(id);
        el.style.left = (W * (0.12 + i * 0.34)) + "px";
        el.style.top = (H * (0.1 + (i % 2) * 0.06)) + "px";
        el.style.opacity = Math.max(0, Math.sin(t * 2.2 + i * 2.1)) * 0.9;
        el.style.transform = "rotate(" + (t * 40 + i * 30) + "deg) scale(" + (0.8 + 0.3 * Math.sin(t * 2.2 + i)) + ")";
      });
      // 文字逐字弹入（0.6s ~ D*0.7）
      var start = 0.6, end = Math.max(D * 0.7, start + 0.6);
      var total = text.length;
      spans.forEach(function (s, i) {
        var local = Math.max(0, Math.min(1, ((t - start) / (end - start)) * total - i));
        var eb = bounce(local);
        s.style.opacity = Math.min(1, local * 2);
        s.style.transform = "translateY(" + (20 * (1 - eb)) + "px)";
      });
    };
    window.__seek(0);
  })();
</script>
</body>
</html>
